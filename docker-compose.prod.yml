services:
  web:
    image: ${DOCKER_IMAGE:?Set DOCKER_IMAGE in .env}
    build:
      context: .
      target: production
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Set NODE_IMAGE in .env}
        APP_PORT: ${APP_PORT:?Set APP_PORT in .env}
        DOCKER_HOSTNAME: ${DOCKER_HOSTNAME:?Set DOCKER_HOSTNAME in .env}
        DOCKER_UID: ${DOCKER_UID:?Set DOCKER_UID in .env}
        DOCKER_GID: ${DOCKER_GID:?Set DOCKER_GID in .env}
        DEV_NODE_ENV: ${DEV_NODE_ENV:?Set DEV_NODE_ENV in .env}
        PROD_NODE_ENV: ${PROD_NODE_ENV:?Set PROD_NODE_ENV in .env}
        DOCKER_HUSKY: ${DOCKER_HUSKY:?Set DOCKER_HUSKY in .env}
        NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED:?Set NEXT_TELEMETRY_DISABLED in .env}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:?Set NEXT_PUBLIC_APP_NAME in .env}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
        HEALTHCHECK_HOST: ${HEALTHCHECK_HOST:?Set HEALTHCHECK_HOST in .env}
        HEALTHCHECK_TIMEOUT_MS: ${HEALTHCHECK_TIMEOUT_MS:?Set HEALTHCHECK_TIMEOUT_MS in .env}
    ports:
      - '${DOCKER_BIND_HOST}:${APP_PORT}:${APP_PORT}'
    environment:
      ENABLE_DEMO_MODE: ${ENABLE_DEMO_MODE}
      NODE_ENV: ${PROD_NODE_ENV}
      PORT: ${APP_PORT}
      HOSTNAME: ${DOCKER_HOSTNAME}
      HEALTHCHECK_HOST: ${HEALTHCHECK_HOST}
      HEALTHCHECK_TIMEOUT_MS: ${HEALTHCHECK_TIMEOUT_MS}
    init: true
    read_only: true
    tmpfs:
      - '/tmp:rw,noexec,nosuid,size=${DOCKER_TMP_SIZE},mode=1777'
      - '/app/.next/cache:rw,noexec,nosuid,size=${DOCKER_NEXT_CACHE_SIZE},uid=${DOCKER_UID},gid=${DOCKER_GID}'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: ${DOCKER_RESTART_POLICY}
    healthcheck:
      test: ['CMD', 'node', 'scripts/healthcheck.ts']
      interval: ${DOCKER_HEALTH_INTERVAL:?Set DOCKER_HEALTH_INTERVAL in .env}
      timeout: ${DOCKER_HEALTH_TIMEOUT:?Set DOCKER_HEALTH_TIMEOUT in .env}
      start_period: ${DOCKER_HEALTH_START_PERIOD:?Set DOCKER_HEALTH_START_PERIOD in .env}
      retries: ${DOCKER_HEALTH_RETRIES:?Set DOCKER_HEALTH_RETRIES in .env}
