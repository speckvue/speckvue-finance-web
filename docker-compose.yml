services:
  redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE in .env}
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Initialize REDIS_PASSWORD in .env}
      REDIS_INTERNAL_PORT: ${REDIS_INTERNAL_PORT}
      REDIS_MAX_MEMORY: ${REDIS_MAX_MEMORY}
    command:
      [
        '/bin/sh',
        '-ec',
        'exec redis-server --port "$$REDIS_INTERNAL_PORT" --requirepass "$$REDIS_PASSWORD" --maxmemory "$$REDIS_MAX_MEMORY" --maxmemory-policy noeviction --save "" --appendonly no',
      ]
    ports:
      - '${DOCKER_BIND_HOST}:${REDIS_PORT}:${REDIS_INTERNAL_PORT}'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:noexec,nosuid,size=16m']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli -p "$$REDIS_INTERNAL_PORT" ping | grep -q PONG',
        ]
      interval: ${DOCKER_HEALTH_INTERVAL}
      timeout: ${DOCKER_HEALTH_TIMEOUT}
      retries: ${DOCKER_HEALTH_RETRIES}
    mem_limit: ${DOCKER_REDIS_MEMORY}
    cpus: ${DOCKER_REDIS_CPUS}
  web:
    build:
      context: .
      target: development
      args:
        HTTP_PROXY: ${DOCKER_HTTP_PROXY:-}
        http_proxy: ${DOCKER_HTTP_PROXY:-}
        https_proxy: ${DOCKER_HTTPS_PROXY:-}
        no_proxy: ${DOCKER_NO_PROXY:-}
        HTTPS_PROXY: ${DOCKER_HTTPS_PROXY:-}
        NO_PROXY: ${DOCKER_NO_PROXY:-}
        DOCKER_LOG_DIRECTORY: ${DOCKER_LOG_DIRECTORY}
        NODE_IMAGE: ${NODE_IMAGE:?Set NODE_IMAGE in .env}
        APP_PORT: ${APP_PORT:?Set APP_PORT in .env}
        DOCKER_HOSTNAME: ${DOCKER_HOSTNAME:?Set DOCKER_HOSTNAME in .env}
        DOCKER_UID: ${DOCKER_UID:?Set DOCKER_UID in .env}
        DOCKER_GID: ${DOCKER_GID:?Set DOCKER_GID in .env}
        DEV_NODE_ENV: ${DEV_NODE_ENV:?Set DEV_NODE_ENV in .env}
        PROD_NODE_ENV: ${PROD_NODE_ENV:?Set PROD_NODE_ENV in .env}
        DOCKER_HUSKY: ${DOCKER_HUSKY:?Set DOCKER_HUSKY in .env}
        NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED:?Set NEXT_TELEMETRY_DISABLED in .env}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:?Set NEXT_PUBLIC_APP_NAME in .env}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
        HEALTHCHECK_HOST: ${HEALTHCHECK_HOST:?Set HEALTHCHECK_HOST in .env}
        HEALTHCHECK_TIMEOUT_MS: ${HEALTHCHECK_TIMEOUT_MS:?Set HEALTHCHECK_TIMEOUT_MS in .env}
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '${DOCKER_BIND_HOST}:${APP_PORT}:${APP_PORT}'
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_DIRECTORY: ${DOCKER_LOG_DIRECTORY}
      LOG_FILE_ENABLED: ${LOG_FILE_ENABLED}
      LOG_MAX_SIZE: ${LOG_MAX_SIZE}
      LOG_MAX_FILES: ${LOG_MAX_FILES}
      REDIS_HOST: ${DOCKER_REDIS_HOST}
      REDIS_PORT: ${REDIS_INTERNAL_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX}
      REDIS_TLS: ${REDIS_TLS}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS}
      REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS}
      REDIS_CACHE_TTL_SECONDS: ${REDIS_CACHE_TTL_SECONDS}
      API_INTERNAL_URL: ${DOCKER_API_INTERNAL_URL}
      NODE_OPTIONS: ${DEV_NODE_OPTIONS}
      APP_HOST: ${DOCKER_HOSTNAME}
      APP_PORT: ${APP_PORT}
      NODE_ENV: ${DEV_NODE_ENV}
      WATCHPACK_POLLING: ${DOCKER_POLLING}
      HEALTHCHECK_HOST: ${HEALTHCHECK_HOST}
      HEALTHCHECK_TIMEOUT_MS: ${HEALTHCHECK_TIMEOUT_MS}
      PORT: ${APP_PORT}
    volumes:
      - ./.env:/app/.env:ro
      - dev-next-cache:/app/.next
      - web-logs:${DOCKER_LOG_DIRECTORY}
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          initial_sync: true
          include:
            - src/**
            - public/**
          ignore:
            - node_modules/
            - .next/
        - action: sync+restart
          path: ./scripts
          target: /app/scripts
          initial_sync: true
        - action: sync+restart
          path: ./next.config.ts
          target: /app/next.config.ts
          initial_sync: true
        - action: sync+restart
          path: ./tsconfig.json
          target: /app/tsconfig.json
          initial_sync: true
        - action: sync+restart
          path: ./postcss.config.mjs
          target: /app/postcss.config.mjs
          initial_sync: true
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./.npmrc
        - action: rebuild
          path: ./Dockerfile
    mem_limit: ${DOCKER_DEV_MEMORY}
    cpus: ${DOCKER_DEV_CPUS}
    init: true
    healthcheck:
      test: ['CMD', 'node', 'scripts/healthcheck.ts']
      interval: ${DOCKER_HEALTH_INTERVAL:?Set DOCKER_HEALTH_INTERVAL in .env}
      timeout: ${DOCKER_HEALTH_TIMEOUT:?Set DOCKER_HEALTH_TIMEOUT in .env}
      start_period: ${DOCKER_DEV_HEALTH_START_PERIOD:?Set DOCKER_DEV_HEALTH_START_PERIOD in .env}
      retries: ${DOCKER_HEALTH_RETRIES:?Set DOCKER_HEALTH_RETRIES in .env}

volumes:
  web-logs:
  dev-next-cache:
