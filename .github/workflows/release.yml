name: Release
on:
  workflow_run:
    workflows: [Verify frontend]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Release only the verified revision
        id: verified
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$VERIFIED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.verified.outputs.current == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.verified.outputs.current == 'true'
        env:
          HUSKY: '0'
      - run: cp .env.example .env
        if: steps.verified.outputs.current == 'true'
      - run: npm run release
        if: steps.verified.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          HUSKY: '0'
